[package]
name = "yfocus"
version = "0.1.0"
edition = "2021"
description = "Focus queue CLI (Rust port of ts/cli.ts)"
license = "MIT"
authors = ["youn"]

[[bin]]
name = "yfocus"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
strip = "debuginfo"

[dev-dependencies]
tempfile = "3.10"
